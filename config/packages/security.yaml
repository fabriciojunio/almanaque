security:
    password_hashers:
        # auto usa argon2id quando a extensão existe e bcrypt quando não.
        # Em teste, o custo mínimo: senha forte não é o que a bateria testa, e
        # cifrar senha de verdade em cada teste multiplica o tempo por dez.
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
            algorithm: auto

    providers:
        usuarios:
            entity:
                class: App\Dominio\Identidade\Usuario
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # A API é sem estado: o token vai no cabeçalho, e nada é guardado em
        # sessão. É o que permite mais de uma réplica atrás do balanceador.
        api:
            pattern: ^/api
            stateless: true
            access_token:
                token_handler: App\Infraestrutura\Seguranca\AutenticadorDeToken

        principal:
            lazy: true
            provider: usuarios
            form_login:
                login_path: entrar
                check_path: entrar
                enable_csrf: true
                default_target_path: suporte_fila
            logout:
                path: sair
                target: entrar
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

    access_control:
        # A ordem importa: a primeira regra que casa é a que vale.
        - { path: ^/api/saude, roles: PUBLIC_ACCESS }
        - { path: ^/api/tokens, roles: PUBLIC_ACCESS }
        - { path: ^/api/g/, roles: PUBLIC_ACCESS }
        - { path: ^/api/, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/suporte, roles: ROLE_SUPORTE }
        - { path: ^/entrar, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: PUBLIC_ACCESS }

    role_hierarchy:
        ROLE_ADMIN: [ROLE_SUPORTE, ROLE_DONO_DO_PORTAL, ROLE_ANUNCIANTE]
        ROLE_SUPORTE: [ROLE_ANUNCIANTE]
        ROLE_DONO_DO_PORTAL: [ROLE_ANUNCIANTE]

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
