# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

parameters:
    app.versao: '%env(APP_VERSAO)%'
    app.elasticsearch.url: '%env(ELASTICSEARCH_URL)%'
    app.elasticsearch.indice: '%env(ELASTICSEARCH_INDICE)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            string $versaoDaAplicacao: '%app.versao%'
            # O Symfony nomeia o serviço do limitador pela chave do YAML
            # (login vira $loginLimiter). Os nomes daqui ficam em português,
            # como o resto do código, então a ligação é explícita.
            Symfony\Component\RateLimiter\RateLimiterFactoryInterface $limitadorDeLogin: '@limiter.login'
            Symfony\Component\RateLimiter\RateLimiterFactoryInterface $limitadorDeBusca: '@limiter.busca_publica'
            Symfony\Component\RateLimiter\RateLimiterFactoryInterface $limitadorDeChamado: '@limiter.abertura_de_chamado'

    App\:
        resource: '../src/'
        exclude:
            - '../src/Dominio/*/[A-Z]*.php'
            - '../src/Kernel.php'

    # Os repositórios são serviços, mas as entidades e os enums do domínio não.
    App\Dominio\:
        resource: '../src/Dominio/*/Repositorio/'

    # Qual busca a aplicação usa é decidido na partida, pela presença da
    # variável de ambiente. Ver FabricaDeBusca.
    App\Dominio\Busca\MotorDeBusca:
        factory: ['App\Infraestrutura\Busca\FabricaDeBusca', 'motor']
        arguments:
            $url: '%app.elasticsearch.url%'
            $indice: '%app.elasticsearch.indice%'

    # Quem cobra de verdade. Trocar o adquirente é trocar esta linha, e o
    # domínio não fica sabendo.
    App\Dominio\Assinatura\Gateway: '@App\Infraestrutura\Pagamento\GatewayDeDemonstracao'

    # Precisa vir antes do resolvedor do Doctrine, que tentaria achar o portal
    # pelo identificador e devolveria 404 antes de a rota chegar ao controller.
    App\Infraestrutura\Http\ResolvedorDePortal:
        tags:
            - { name: controller.argument_value_resolver, priority: 150 }

    App\Dominio\Busca\Indexador:
        factory: ['App\Infraestrutura\Busca\FabricaDeBusca', 'indexador']
        arguments:
            $url: '%app.elasticsearch.url%'
            $indice: '%app.elasticsearch.indice%'
