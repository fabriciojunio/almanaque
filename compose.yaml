# Ambiente local completo: banco, índice de busca, a aplicação e a borda.
#
#   cp .env.example .env.local        # e preencha as senhas
#   docker compose up -d
#   docker compose exec api php bin/console doctrine:migrations:migrate -n
#   docker compose exec api php bin/console doctrine:fixtures:load -n
#   docker compose exec api php bin/console almanaque:reindexar
#
# O guia abre em http://localhost:8080.
#
# Para trabalhar sem Elasticsearch, suba só o essencial e deixe
# ELASTICSEARCH_URL vazio: o sistema cai na busca do banco sozinho.
#
#   docker compose up -d banco cache api borda
#
# Para exercitar o S3 sem conta na AWS:
#
#   docker compose --profile aws up -d localstack

name: almanaque

services:
  api:
    build:
      context: .
      target: desenvolvimento
    container_name: almanaque-api
    volumes:
      - .:/app
    env_file:
      - path: .env.local
        required: false
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DATABASE_URL: mysql://almanaque:${DB_SENHA:?defina DB_SENHA no .env.local}@banco:3306/almanaque?serverVersion=8.0&charset=utf8mb4
      ELASTICSEARCH_URL: http://indice:9200
    depends_on:
      banco:
        condition: service_healthy
      indice:
        condition: service_healthy
    restart: unless-stopped

  borda:
    image: nginx:1.27-alpine
    container_name: almanaque-borda
    ports:
      - '8080:8080'
    volumes:
      - .:/app:ro
      - ./docker/nginx/almanaque.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

  banco:
    image: mysql:8.0
    container_name: almanaque-banco
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_SENHA_ROOT:?defina DB_SENHA_ROOT no .env.local}
      MYSQL_DATABASE: almanaque
      MYSQL_USER: almanaque
      MYSQL_PASSWORD: ${DB_SENHA:?defina DB_SENHA no .env.local}
    ports:
      - '3306:3306'
    volumes:
      - banco:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  indice:
    image: elasticsearch:8.15.3
    container_name: almanaque-indice
    environment:
      discovery.type: single-node
      # Sem TLS e sem senha, de propósito: é o índice local, que não sai da
      # rede do compose. Em produção o acesso é autenticado.
      xpack.security.enabled: 'false'
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - '9200:9200'
    healthcheck:
      test: ['CMD-SHELL', 'curl -sf http://localhost:9200/_cluster/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  cache:
    image: redis:7-alpine
    container_name: almanaque-cache
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --save ''
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Só sobe com --profile aws. A AWS de mentira, para exercitar o upload da
  # imagem do anúncio e a URL assinada sem conta e sem cobrança.
  localstack:
    image: localstack/localstack:3.8
    container_name: almanaque-localstack
    profiles: ['aws']
    environment:
      SERVICES: s3
      DEBUG: '0'
    ports:
      - '4566:4566'
    healthcheck:
      test: ['CMD-SHELL', 'awslocal s3 ls || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  banco:
