; Configuração do PHP para o Almanaque.

; Nada de contar a versão do PHP no cabeçalho da resposta.
expose_php = Off

; Erro nenhum vai para a tela: o que o visitante vê é a página de erro da
; aplicação, com o identificador da requisição. O detalhe fica no log.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

memory_limit = 256M
max_execution_time = 30

; O anexo do anúncio tem limite de 8 MB na aplicação. Aqui fica um pouco
; acima, senão o PHP corta antes e o erro que chega ao cliente não diz nada.
upload_max_filesize = 10M
post_max_size = 12M

date.timezone = America/Sao_Paulo

; Sessão só é usada no console de suporte, e sempre sob HTTPS em produção.
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
session.use_strict_mode = 1

opcache.enable = 1
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.preload_user = www-data
