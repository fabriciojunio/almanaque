# A borda: serve o estático e manda o resto para o PHP-FPM.

server {
    listen 8080;
    server_name _;
    root /app/public;

    server_tokens off;
    client_max_body_size 12M;

    # A aplicação já responde com os cabeçalhos de segurança. Estes ficam
    # aqui para valerem também no que o Nginx serve sozinho, como as fontes.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Os dois ficam um ano no navegador, e o endereço carrega um trecho do
    # conteúdo (ver VersaoPeloConteudo): arquivo que muda ganha outro endereço
    # e chega na hora, arquivo que não muda não é baixado de novo. Sem essa
    # marca, correção publicada na folha de estilo não aparecia para quem já
    # tinha visitado o site.
    location ~ ^/(fontes|estilos)/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass almanaque-api:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    # Qualquer outro .php é tentativa de execução de coisa que não é ponto de
    # entrada. Não existe.
    location ~ \.php$ {
        return 404;
    }
}
